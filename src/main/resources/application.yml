spring:
  application:
    name: businessflow
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/businessflow}
    username: ${DB_USERNAME:businessflow}
    password: ${DB_PASSWORD:businessflow_dev}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
